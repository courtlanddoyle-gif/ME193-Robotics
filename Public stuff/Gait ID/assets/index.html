<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gait ID</title>
    <style>
      :root {
        --bg: #101214;
        --card: #1b1e22;
        --text: #f2f2f2;
        --muted: #9aa0a6;
        --standing: #8ab4f8;
        --walking: #81c995;
        --running: #f28b82;
        --biking: #fdd663;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        gap: 16px;
      }
      header {
        width: 100%;
        max-width: 520px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 0.95rem;
      }
      #conn::before {
        content: "";
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 6px;
        background: #f28b82;
      }
      #conn.live::before { background: #81c995; }
      #main {
        width: 100%;
        max-width: 520px;
        background: var(--card);
        border-radius: 24px;
        border: 4px solid var(--muted);
        padding: 32px 16px;
        text-align: center;
        transition: border-color 0.2s;
      }
      #emoji { font-size: clamp(5rem, 30vw, 9rem); line-height: 1; }
      #label {
        font-size: clamp(2.5rem, 14vw, 4.5rem);
        font-weight: 800;
        margin-top: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #sub { color: var(--muted); margin-top: 8px; font-size: 1rem; }
      #m1 {
        width: 100%;
        max-width: 520px;
        background: var(--card);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.15rem;
      }
      #m1 b { font-size: 1.4rem; }
      #agree { font-size: 0.95rem; color: var(--muted); }
      details {
        width: 100%;
        max-width: 520px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      td { padding: 4px 0; font-variant-numeric: tabular-nums; }
      td:last-child { text-align: right; color: var(--text); }
      .stale #main { opacity: 0.45; }
    </style>
  </head>
  <body>
    <header>
      <span>Gait ID</span>
      <span id="conn">Connecting&hellip;</span>
    </header>

    <section id="main">
      <div id="emoji">&hellip;</div>
      <div id="label">waiting</div>
      <div id="sub">Model 2 (all IMU channels)</div>
    </section>

    <section id="m1">
      <span>Model 1 (one axis): <b id="m1label">&ndash;</b></span>
      <span id="agree"></span>
    </section>

    <details>
      <summary>Live feature values</summary>
      <table id="features"></table>
    </details>

    <script src="app.js"></script>
  </body>
</html>
